# Development overlay — apply on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# Changes from production:
#   - FastAPI:  source mounted, uvicorn --reload, port 8000 exposed directly
#   - Worker:   source mounted (ARQ)
#   - Next.js:  source mounted, npm run dev, port 3000 exposed directly
#   - nginx:    disabled (dev hits services directly on their native ports)
#   - Postgres: local throwaway Postgres for SQLAlchemy/Alembic dev work.
#     Production points DATABASE_URL at the real Neon-hosted Postgres instead —
#     this local instance is dev-only and never touches production data.
#
# Volume notes:
#   - api_venv: named volume isolates the container's uv-managed virtualenv
#     (/app/.venv, built at image-build time) from the host's ./apps/api bind
#     mount, which would otherwise shadow/erase it at container start.
#   - /app/node_modules: anonymous volume prevents the host ./apps/web mount
#     from clobbering the container-installed node_modules.
#   - .next: anonymous volume keeps Next's dev build output inside the
#     container instead of round-tripping through the Windows/Docker Desktop
#     bind-mount boundary — writing .next/static across that boundary is a
#     known source of "ENOENT: no such file or directory, mkdir '.../.next/static'"
#     errors on Windows. Same fix pattern as node_modules above.
#   - postgres_data: persists the local dev DB across restarts. A fresh
#     Postgres now boots with an EMPTY database (no docker-entrypoint-initdb.d
#     bootstrap SQL) — Alembic is the single schema source of truth for both
#     local dev and real Neon databases. After first boot (or after deleting
#     this volume to reset), run `pnpm api:migrate` once to create the schema.
#
# APP_URL override: the base docker-compose.yml reads APP_URL from apps/api/.env.
# The environment: block below takes precedence for dev, setting it to localhost:3000
# so FastAPI's CORS allows the browser origin. If you customise APP_URL in .env,
# update the value below to match.

services:
  nginx:
    profiles: ["disabled"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jobnok
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Dev-only DB browser for the local Postgres above — http://localhost:8085,
  # log in with System: PostgreSQL, Server: postgres, User: postgres,
  # Password: devpassword, Database: jobnok. Not in the base/prod compose file
  # on purpose — no DB admin UI should ever be exposed in production.
  adminer:
    image: adminer:latest
    ports:
      - "8085:8080"
    networks:
      - backend-net
    restart: unless-stopped

  # Local throwaway Redis for ARQ's queue (api enqueues, worker consumes) —
  # dev-only, keeps ARQ's constant polling off the real Upstash instance so it
  # doesn't burn the shared command quota. Upstash itself stays untouched and
  # keeps serving app/services/cache.py's rate-limiting/caching in every
  # environment — this container only replaces REDIS_URL's target, nothing else.
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/api:/app
      # Isolate the uv-managed venv from the host directory (see note above)
      - api_venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:devpassword@postgres:5432/jobnok
      # Local throwaway Postgres has no pooler — same URL serves both roles.
      - MIGRATIONS_DATABASE_URL=postgresql://postgres:devpassword@postgres:5432/jobnok
      # Overrides the Upstash REDIS_URL from apps/api/.env — ARQ (enqueue side,
      # via app.state.arq_pool) talks to local Redis in dev. Upstash-specific
      # UPSTASH_REDIS_REST_URL/TOKEN are untouched and still come from .env,
      # since app/services/cache.py's rate-limiting/caching keeps using Upstash.
      - REDIS_URL=redis://redis:6379/0

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:devpassword@postgres:5432/jobnok
      # See the api service's identical override above — same reason.
      - REDIS_URL=redis://redis:6379/0

  nextjs:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      - ./apps/web:/repo/apps/web
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
      # @jobnok/ui is a workspace package consumed as raw TS source (no build
      # step) — Dockerfile.dev doesn't COPY it in, so it must be bind-mounted
      # like the app itself, or only package.json (copied at image build time)
      # would be visible and every @jobnok/ui import would 404 at runtime.
      - ./packages/ui:/repo/packages/ui
      - /repo/packages/ui/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # Server-side only — used by Next.js rewrites to reach the API inside Docker.
      # Never exposed to the browser (no NEXT_PUBLIC_ prefix).
      - BACKEND_URL=http://api:8000
      # Docker Desktop's bind-mount layer on Windows can silently drop native
      # filesystem change events (inotify), so webpack's watcher never fires
      # and edits stop hot-reloading until the route is freshly requested.
      # Polling sidesteps this — it checks file mtimes on an interval instead
      # of relying on those events.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    # The base docker-compose.yml's 512M/1.0cpu limit is sized for a built
    # production server — dev-mode webpack/HMR needs much more headroom, or
    # compiles thrash at the memory ceiling and crawl (observed at 97%+ usage).
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile.dev
    volumes:
      - ./apps/marketing:/repo/apps/marketing
      - /repo/apps/marketing/node_modules
      - /repo/apps/marketing/.next
      # See the nextjs service's identical mounts above — same reasons.
      - ./packages/ui:/repo/packages/ui
      - /repo/packages/ui/node_modules
    ports:
      - "3001:3001"
    environment:
      # Points at the dashboard app — marketing's Log in/Sign up/tool links
      # are absolute URLs since the two apps live on separate subdomains in prod.
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # See the nextjs service's identical vars above — same Windows bind-mount reason.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    # Overrides the base docker-compose.yml healthcheck, which checks port 3000
    # (the prod `next start` port). Dev mode runs `next dev -p 3001` instead —
    # without this override the healthcheck always fails against a port nothing
    # is listening on, even though the dev server is fine.
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    volumes:
      - ./apps/admin:/repo/apps/admin
      - /repo/apps/admin/node_modules
      - /repo/apps/admin/.next
      # See the nextjs service's identical mounts above — same reasons.
      - ./packages/ui:/repo/packages/ui
      - /repo/packages/ui/node_modules
    ports:
      - "3002:3002"
    environment:
      - NEXT_PUBLIC_APP_URL=http://localhost:3002
      - BACKEND_URL=http://api:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    # Same reasoning as marketing's override above - dev mode runs on 3002,
    # not the prod `next start` port the base healthcheck checks.
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3002/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 3G/2.0, matching the nextjs service above, not marketing's lighter 1G -
    # admin runs the same full Next.js dev server (webpack/HMR) as nextjs,
    # just with fewer pages; page count doesn't reduce the dev server's
    # baseline memory need. The 1G limit this had before caused real ENOMEM
    # crashes (Watchpack's initial directory scan hit the container's own
    # cgroup memory cap, observed at 86% usage / 99% CPU right before it
    # failed) - same "thrash and crawl" failure mode nextjs's own comment
    # already documented, just not applied here originally.
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

volumes:
  api_venv:
  postgres_data:
  redis_data:
