services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      nextjs:
        condition: service_healthy
      marketing:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    expose:
      - "8000"
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    command: arq app.workers.arq_worker.WorkerSettings
    env_file:
      - ./apps/api/.env
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  nextjs:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_RATE_LIMIT_LINKEDIN: ${NEXT_PUBLIC_RATE_LIMIT_LINKEDIN}
        NEXT_PUBLIC_RATE_LIMIT_RESUME_AI: ${NEXT_PUBLIC_RATE_LIMIT_RESUME_AI}
        NEXT_PUBLIC_RATE_LIMIT_RESUME_PDF: ${NEXT_PUBLIC_RATE_LIMIT_RESUME_PDF}
        NEXT_PUBLIC_RATE_LIMIT_COVER_LETTER: ${NEXT_PUBLIC_RATE_LIMIT_COVER_LETTER}
        NEXT_PUBLIC_RATE_LIMIT_INTERVIEW: ${NEXT_PUBLIC_RATE_LIMIT_INTERVIEW}
        NEXT_PUBLIC_RATE_LIMIT_SALARY: ${NEXT_PUBLIC_RATE_LIMIT_SALARY}
        NEXT_PUBLIC_RATE_LIMIT_JOB_SEARCH: ${NEXT_PUBLIC_RATE_LIMIT_JOB_SEARCH}
        NEXT_PUBLIC_RATE_LIMIT_STARTUP_HUNT: ${NEXT_PUBLIC_RATE_LIMIT_STARTUP_HUNT}
        NEXT_PUBLIC_RATE_LIMIT_BULK_CAMPAIGN: ${NEXT_PUBLIC_RATE_LIMIT_BULK_CAMPAIGN}
        NEXT_PUBLIC_RATE_LIMIT_BULK_MONTH: ${NEXT_PUBLIC_RATE_LIMIT_BULK_MONTH}
        NEXT_PUBLIC_BULK_EMAIL_MIN_DELAY: ${NEXT_PUBLIC_BULK_EMAIL_MIN_DELAY}
        NEXT_PUBLIC_BULK_EMAIL_DEFAULT_DELAY: ${NEXT_PUBLIC_BULK_EMAIL_DEFAULT_DELAY}
        NEXT_PUBLIC_LINKEDIN_CACHE_TTL_DAYS: ${NEXT_PUBLIC_LINKEDIN_CACHE_TTL_DAYS}
    env_file:
      - ./apps/web/.env.local
    environment:
      BACKEND_URL: http://api:8000
    expose:
      - "3000"
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    expose:
      - "3000"
    networks:
      - frontend-net
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  # Internal crawler-observability app - own Clerk origin (see
  # ADMIN_APP_URL/settings.admin_app_url), gated to profiles.role=='admin' on
  # every API call (app/modules/admin/routes.py), not just at this app's
  # login screen.
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Same Clerk publishable key as the nextjs service, deliberately -
        # this is the SAME Clerk application as apps/web (one JWKS/issuer,
        # see settings.clerk_jwks_url/clerk_issuer), just with
        # admin.jobnok.com added as an additional allowed origin/redirect URL
        # in that one Clerk app's dashboard settings. A different publishable
        # key here would mean a different Clerk application, whose tokens
        # the backend's single JWKS endpoint couldn't even verify.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${ADMIN_APP_URL}
    env_file:
      - ./apps/admin/.env.local
    environment:
      BACKEND_URL: http://api:8000
    expose:
      - "3000"
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

networks:
  frontend-net:
  backend-net:
