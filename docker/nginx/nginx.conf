worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # WebSocket upgrade helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # IP-based rate limit: 30 req/min with burst of 10
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    upstream api {
        server api:8000;
    }

    upstream nextjs {
        server nextjs:3000;
    }

    server {
        listen 80;

        # Security headers applied to all responses
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header X-XSS-Protection        "1; mode=block"                    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "geolocation=(), microphone=()"    always;

        # SSE / streaming — disable buffering, extend timeouts
        location /api/ai/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;

            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Startup Hunt search — runs multiple slow upstream providers (Apify, TheirStack, Google CSE)
        location /api/startup-hunt/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Startup Scout search — multiple DDG queries with 3 s gaps; limit=200 can take ~90 s
        location /api/startup-scout/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Supabase OAuth callback stays in Next.js
        location /api/auth/ {
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      $connection_upgrade;
        }

        # All other /api/* → FastAPI
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Everything else → Next.js
        location / {
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      $connection_upgrade;
        }
    }
}
