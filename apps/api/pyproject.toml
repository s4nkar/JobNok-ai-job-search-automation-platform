[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobnok-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.5",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "ddgs>=9.0",                # DuckDuckGo search (renamed from duckduckgo-search)
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    # AI Providers
    # Embeddings (API-based — Jina/Cohere). Only numpy needed locally for matrix ops.
    "numpy>=1.26,<3.0",
    # Background Tasks
    "arq==0.26.1",
    "redis==5.0.8",
    # Database — direct Postgres access via SQLAlchemy, hosted on Neon.
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.13.3",
    # PDF Parsing + Generation
    "PyMuPDF==1.24.9",
    "scrapling>=0.2.96",
    "weasyprint==62.3",
    "pydyf==0.10.0",
    "jinja2==3.1.4",
    # File uploads
    "python-multipart==0.0.9",
    # CV photo storage
    "cloudinary==1.41.0",
    # Email
    "resend==2.4.0",
    # Error Monitoring
    "sentry-sdk[fastapi]==2.12.0",
    # JWT Validation
    "PyJWT==2.9.0",
    "cryptography==43.0.0",
    # Clerk webhook signature verification
    "svix==1.61.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Scoped to real bugs (unused imports/vars, undefined names) for now — the
# existing codebase has never been import-sorted or line-length-formatted,
# so E/I/UP are left off until a dedicated cleanup pass runs `ruff format` +
# `ruff check --fix` across the repo. CI runs this exact ruleset (`ruff check .`),
# so local and CI results always match.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
