[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickjob-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.5",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "ddgs>=9.0",                # DuckDuckGo search (renamed from duckduckgo-search)
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",

    # AI Providers
    "anthropic==0.32.0",
    "huggingface-hub>=0.31.0",

    # Embeddings (API-based — Jina/Cohere). Only numpy needed locally for matrix ops.
    "numpy>=1.26,<3.0",

    # Background Tasks
    "celery==5.4.0",
    "redis==5.0.8",

    # Database — direct Postgres access via SQLAlchemy. Supabase remains the
    # Postgres host + Auth/JWT provider (see app/core/security.py), but is no
    # longer used as a query client.
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.13.3",

    # PDF Parsing + Generation
    "PyMuPDF==1.24.9",
    "scrapling>=0.2.96",
    "weasyprint==62.3",
    "pydyf==0.10.0",
    "jinja2==3.1.4",

    # File uploads
    "python-multipart==0.0.9",

    # Email
    "resend==2.4.0",

    # Error Monitoring
    "sentry-sdk[fastapi]==2.12.0",

    # JWT Validation
    "PyJWT==2.9.0",
    "cryptography==43.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
